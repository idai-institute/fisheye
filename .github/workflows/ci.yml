name: test
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: ruff check fisheye fisheye_instant tools examples
      - run: ruff format --check fisheye fisheye_instant tools examples
      - run: python -m build
      - run: python tools/wheel_smoke.py
      - run: fisheye evaluate --split all
  integrations:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        integration: [langchain, openai-agents, camel, telemetry]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,${{ matrix.integration }}]'
      - run: python -m pytest -q fisheye/tests/test_native_integrations.py
  instant-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,instant]' playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tools/instant_browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instant-browser-screenshots
          path: /tmp/instant-*.png
