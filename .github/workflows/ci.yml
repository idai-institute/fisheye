name: test
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: ruff check fisheye
      - run: ruff format --check fisheye
      - run: python -m build
      - run: python tools/wheel_smoke.py
      - run: fisheye evaluate --split all
  integrations:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        integration: [langchain, openai-agents, camel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,${{ matrix.integration }}]'
      - run: python -m pytest -q fisheye/tests/test_native_integrations.py
