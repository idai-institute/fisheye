[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fisheye"
version = "0.2.1"
description = "Evidence-based oversight for cooperating tool-calling agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3", "tomli>=2; python_version<'3.11'"]

[project.optional-dependencies]
server = ["fastapi>=0.115,<0.116", "starlette>=0.40,<0.47", "uvicorn>=0.30,<1", "jinja2>=3.1.6,<4"]
langchain = ["langchain-core==0.3.63"]
openai-agents = ["openai-agents==0.0.17", "openai==1.82.0"]
camel = ["camel-ai==0.2.58", "openai==1.82.0", "numpy>=1.26,<3", "pillow>=11,<12", "jsonschema>=4.23,<5", "requests-oauthlib>=2,<3", "sqlalchemy>=2,<3", "pandas>=2.2,<3", "beautifulsoup4>=4.13,<5"]
telemetry = ["opentelemetry-api==1.33.1", "opentelemetry-sdk==1.33.1"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "build>=1.2,<2", "ruff==0.11.13", "fastapi>=0.115,<0.116", "starlette>=0.40,<0.47", "jinja2>=3.1.6,<4", "uvicorn>=0.30,<1"]

[project.scripts]
fisheye = "fisheye.cli.main:main"

[tool.setuptools.packages.find]
include = ["fisheye*"]
exclude = ["fisheye.tests*"]

[tool.setuptools.package-data]
fisheye = ["templates/*.html", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["fisheye/tests"]
filterwarnings = ["ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
