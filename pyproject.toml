[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fisheye"
version = "0.1.0"
description = "Anomaly detection library for tool-calling agents"
readme = "docs/spec.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[project.scripts]
fisheye = "fisheye.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["fisheye/tests"]
